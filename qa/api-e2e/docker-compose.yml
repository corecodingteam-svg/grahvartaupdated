name: gv-test
services:
  db:
    image: postgres:15-alpine
    environment: {POSTGRES_DB: gv_test, POSTGRES_USER: gv, POSTGRES_PASSWORD: gvtestpw}
    ports: ["56432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U gv -d gv_test"], interval: 3s, retries: 20}
  mail:
    image: axllent/mailpit:v1.21
    ports: ["18025:8025"]
  backend:
    build: ../../backend
    environment:
      PORT: "3000"
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: gv_test
      DB_USER: gv
      DB_PASSWORD: gvtestpw
      JWT_SECRET: local-test-secret-not-for-prod-0123456789
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:3300
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: "*"
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: test@local
      SMTP_PASS: x
      TEST_WALLET_CREDIT: "0"
    ports: ["3300:3000"]
    depends_on: {db: {condition: service_healthy}, mail: {condition: service_started}}
