# /etc/nginx/conf.d/default.conf  (inside the nginx container)
# Service names resolve via Docker's internal DNS:
#   backend:3000  |  web-api:8787  |  astrologer:80  |  admin:80

# ── HTTP — redirect to HTTPS + serve certbot ACME challenge ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grahvarta.com www.grahvarta.com api.grahvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API — api.grahvarta.com → backend:3000 ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/api.grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.grahvarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # WebSocket — Socket.io
    location /socket.io/ {
        proxy_pass             http://backend:3000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # Static uploads — serve via nginx (faster than Node)
    location /uploads/ {
        alias   /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # REST API
    location / {
        proxy_pass             http://backend:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  60s;
    }
}

# ── Frontend — grahvarta.com ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grahvarta.com www.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grahvarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Prototype preview — static HTML served directly
    location /preview {
        root  /var/www/static;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # The shop is its own site now (Mirakart at shops.grahvarta.com).
    # 302, not 301, so browsers don't cache it forever if /shop changes again.
    location = /shop    { return 302 https://shops.grahvarta.com/; }
    location ^~ /shop/  { return 302 https://shops.grahvarta.com/; }

    # Admin portal — /admin → admin container
    # The admin container keeps files under /admin/ internally,
    # so the full URI (e.g. /admin/assets/main.js) resolves correctly.
    location ^~ /admin {
        proxy_pass             http://admin:80;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # Backend API calls from admin portal (relative /api/...)
    location ^~ /api/ {
        proxy_pass             http://backend:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        client_max_body_size   20M;
    }

    # GrahVarta Web's own Gemini-backed API (kundli, panchang, tarot, …)
    # Separate prefix from /api/ above, which is reserved for the admin
    # portal's calls to the platform backend.
    location ^~ /web-api/ {
        proxy_pass             http://web-api:8787/api/;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  60s;
    }

    # Astrologer portal SPA — moved off root, lives under /astrologer-portal
    location ^~ /astrologer-portal {
        proxy_pass             http://astrologer:80;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # GrahVarta consumer website — everything else
    location / {
        proxy_pass             http://web:80;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }
}

# ── ArpitVarta (arpitvarta.grahvarta.com) — HTTP + ACME ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name arpitvarta.grahvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── ArpitVarta (arpitvarta.grahvarta.com) — HTTPS ─────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arpitvarta.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/arpitvarta.grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arpitvarta.grahvarta.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $av_backend      http://av-backend:3000;
    set $av_web          http://av-web:80;
    set $av_professional http://av-professional:80;
    set $av_admin        http://av-admin:80;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Socket.io (chat, billing ticks, call signalling)
    location /socket.io/ {
        proxy_pass         $av_backend;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API + uploaded files (served by Express)
    location ^~ /api/     { proxy_pass $av_backend; proxy_read_timeout 60s; }
    location ^~ /uploads/ { proxy_pass $av_backend; expires 7d; }
    location = /health    { proxy_pass $av_backend; }

    location ^~ /admin               { proxy_pass $av_admin; }
    location ^~ /professional-portal { proxy_pass $av_professional; }
    location /                       { proxy_pass $av_web; }
}

# ── Mirakart shop (shops.grahvarta.com) — HTTP + ACME ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name shops.grahvarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Mirakart shop (shops.grahvarta.com) — HTTPS ────────────────────────────
# Mirakart runs on this VPS as its own compose stack (docker-compose.grahvarta.yml
# in the mirakart repo) with no public ports; its web-facing containers join
# grahvarta_default as mk-*. One domain, routed by path; admin and seller
# are built with a matching Next.js basePath. Upstreams resolve at request
# time via Docker DNS, so this nginx still starts when Mirakart is down.
limit_req_zone $binary_remote_addr zone=mk_api:10m rate=20r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shops.grahvarta.com;

    ssl_certificate     /etc/letsencrypt/live/shops.grahvarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shops.grahvarta.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mk_web      http://mk-web:3000;
    set $mk_admin    http://mk-admin:3001;
    set $mk_merchant http://mk-merchant:3002;
    set $mk_api      http://mk-api:4000;
    set $mk_minio    http://mk-minio:9000;

    add_header Strict-Transport-Security "max-age=31536000"               always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # REST API (Nest, global prefix /api)
    location = /api/health/ping { proxy_pass $mk_api; access_log off; }
    location ^~ /api/ {
        limit_req zone=mk_api burst=40 nodelay;
        proxy_pass         $mk_api;
        proxy_read_timeout 60s;
    }

    # Public images in MinIO: /storage/<bucket>/<key> -> mk-minio:9000/<bucket>/<key>
    location ^~ /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass       $mk_minio;
        proxy_set_header Host minio:9000;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Seller center and admin portal (Next.js basePath /seller and /admin)
    location = /seller  { proxy_pass $mk_merchant; }
    location ^~ /seller/ { proxy_pass $mk_merchant; }
    location = /admin   { proxy_pass $mk_admin; }
    location ^~ /admin/  { proxy_pass $mk_admin; }

    # Storefront
    location / { proxy_pass $mk_web; }
}
